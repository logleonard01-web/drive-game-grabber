<!-- Guess the U.S. State — Fast-Paced Version -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    font-family: "Press Start 2P", monospace;
    background: linear-gradient(180deg, #101820, #0d121c);
    color: #e6f0e8;
    padding: 20px;
    text-align: center;
  }

  h1 {
    color: #7FFF00;
    font-size: 18px;
    margin-bottom: 16px;
    text-shadow: 0 0 6px #7fff00;
  }

  .game {
    background: #111a22;
    padding: 20px;
    border-radius: 12px;
    border: 4px solid #000;
    max-width: 800px;
    margin: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }

  .flag {
    font-size: 72px;
    margin: 20px 0;
    transition: transform 0.3s ease;
  }

  .flag:hover {
    transform: scale(1.2) rotate(10deg);
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }

  .choice {
    background: linear-gradient(145deg,#1a2533,#121c28);
    padding: 14px;
    border: 3px solid #000;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
  }

  .choice:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 15px rgba(0,255,0,0.4);
  }

  .choice.correct {
    outline: 3px solid #22c55e;
    box-shadow: 0 0 15px #22c55e;
  }

  .choice.wrong {
    outline: 3px solid #ef4444;
    opacity: 0.8;
    box-shadow: 0 0 15px #ef4444;
  }

  .choice.disabled {
    pointer-events: none;
    opacity: 0.6;
  }

  .score {
    background: #0b1018;
    border: 3px solid #000;
    border-radius: 10px;
    padding: 10px;
    display: inline-block;
    margin: 4px 8px;
  }

  .hint, #feedback {
    color: #9aa4b2;
    font-size: 12px;
    margin-top: 10px;
  }
</style>

<div class="game">
  <h1>🗽 Guess the U.S. State</h1>
  <div class="score">Score: <span id="score">0</span></div>
  <div class="score">High Score: <span id="best">0</span></div>
  <div class="flag" id="flagBox">🏴‍☠️</div>
  <div class="choices" id="choices"></div>
  <div class="hint" id="hintBox">Hint: —</div>
  <div class="hint" id="feedback">Select the correct U.S. state!</div>
</div>

<script>
const STATES = [
  { emoji:"🌴", name:"Florida", hint:"The Sunshine State" },
  { emoji:"🍎", name:"New York", hint:"The Empire State" },
  { emoji:"🌉", name:"California", hint:"The Golden State" },
  { emoji:"🌲", name:"Oregon", hint:"The Beaver State" },
  { emoji:"🏔️", name:"Colorado", hint:"The Centennial State" },
  { emoji:"🏞️", name:"Utah", hint:"The Beehive State" },
  { emoji:"🏄", name:"Hawaii", hint:"The Aloha State" },
  { emoji:"🎰", name:"Nevada", hint:"The Silver State" },
  { emoji:"🦬", name:"Wyoming", hint:"The Equality State" },
  { emoji:"🎡", name:"Texas", hint:"The Lone Star State" },
  { emoji:"🌾", name:"Kansas", hint:"The Sunflower State" },
  { emoji:"🌽", name:"Iowa", hint:"The Hawkeye State" },
  { emoji:"🐎", name:"Kentucky", hint:"The Bluegrass State" },
  { emoji:"🌆", name:"Illinois", hint:"The Prairie State" },
  { emoji:"🍁", name:"Vermont", hint:"The Green Mountain State" },
  { emoji:"🍂", name:"Maine", hint:"The Pine Tree State" },
  { emoji:"🦞", name:"Massachusetts", hint:"The Bay State" },
  { emoji:"🌋", name:"Alaska", hint:"The Last Frontier" },
  { emoji:"🌻", name:"North Dakota", hint:"The Peace Garden State" },
  { emoji:"🍊", name:"Georgia", hint:"The Peach State" },
  { emoji:"🎸", name:"Tennessee", hint:"The Volunteer State" },
  { emoji:"🏀", name:"Indiana", hint:"The Hoosier State" },
  { emoji:"🚗", name:"Michigan", hint:"The Great Lakes State" },
  { emoji:"🎣", name:"Minnesota", hint:"The Land of 10,000 Lakes" },
  { emoji:"🌳", name:"Washington", hint:"The Evergreen State" },
  { emoji:"🎓", name:"Connecticut", hint:"The Constitution State" },
  { emoji:"🌾", name:"Nebraska", hint:"The Cornhusker State" },
  { emoji:"🏙️", name:"Pennsylvania", hint:"The Keystone State" },
  { emoji:"🚀", name:"Alabama", hint:"The Heart of Dixie" },
  { emoji:"🏖️", name:"South Carolina", hint:"The Palmetto State" },
  { emoji:"🏕️", name:"Montana", hint:"The Treasure State" },
  { emoji:"🌅", name:"Arizona", hint:"The Grand Canyon State" },
  { emoji:"🌾", name:"Oklahoma", hint:"The Sooner State" },
  { emoji:"🌉", name:"Missouri", hint:"The Show-Me State" },
  { emoji:"🌽", name:"Ohio", hint:"The Buckeye State" },
  { emoji:"🏕️", name:"Idaho", hint:"The Gem State" },
  { emoji:"🌻", name:"South Dakota", hint:"The Mount Rushmore State" },
  { emoji:"🚜", name:"Wisconsin", hint:"The Badger State" },
  { emoji:"🏔️", name:"New Mexico", hint:"The Land of Enchantment" },
  { emoji:"🏞️", name:"North Carolina", hint:"The Tar Heel State" },
  { emoji:"🏝️", name:"Delaware", hint:"The First State" },
  { emoji:"🎭", name:"Louisiana", hint:"The Pelican State" },
  { emoji:"🏰", name:"Virginia", hint:"The Old Dominion" },
  { emoji:"🌾", name:"Mississippi", hint:"The Magnolia State" },
  { emoji:"🪶", name:"Arkansas", hint:"The Natural State" },
  { emoji:"🏠", name:"Maryland", hint:"The Free State" },
  { emoji:"🌇", name:"New Jersey", hint:"The Garden State" },
  { emoji:"🍎", name:"New Hampshire", hint:"The Granite State" },
  { emoji:"🌄", name:"West Virginia", hint:"The Mountain State" }
];

const flagBox = document.getElementById('flagBox');
const choicesEl = document.getElementById('choices');
const hintBox = document.getElementById('hintBox');
const feedback = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let score = 0;
let best = parseInt(localStorage.getItem("guess_state_best")||"0");
let current = null;
let options = [];
let answered = false;

bestEl.textContent = best;

function randInt(max){ return Math.floor(Math.random()*max); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=randInt(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function pickQuestion(){
  const pool = STATES.slice();
  const chosen = pool.splice(randInt(pool.length),1)[0];
  const opts = [chosen,...shuffle(pool).slice(0,3)];
  shuffle(opts);
  return {chosen, opts};
}

function renderQuestion(){
  const q = pickQuestion();
  current = q.chosen;
  options = q.opts;
  answered = false;

  flagBox.textContent = current.emoji;
  hintBox.textContent = "Hint: " + current.hint;
  feedback.textContent = "Pick the right state!";
  choicesEl.innerHTML = "";

  options.forEach((s,i)=>{
    const b=document.createElement("div");
    b.className="choice";
    b.textContent=s.name;
    b.onclick=()=>select(i);
    choicesEl.appendChild(b);
  });
}

function select(i){
  if(answered) return;
  answered = true;

  const chosen = options[i];
  const nodes = choicesEl.querySelectorAll(".choice");
  nodes.forEach(n => n.classList.add("disabled"));

  if(chosen.name===current.name){
    nodes[i].classList.add("correct");
    feedback.textContent="✅ Correct! It's " + current.name;
    score += 10;
  } else {
    nodes[i].classList.add("wrong");
    nodes.forEach((n,j)=>{ if(options[j].name===current.name) n.classList.add("correct"); });
    feedback.textContent="❌ Incorrect! It was " + current.name;
    score = Math.max(0, score-3);
  }

  scoreEl.textContent = score;
  if(score > best){ best = score; localStorage.setItem("guess_state_best",best); bestEl.textContent = best; }

  setTimeout(renderQuestion, 800); // fast-paced auto next
}

// Start the game
renderQuestion();
</script>
